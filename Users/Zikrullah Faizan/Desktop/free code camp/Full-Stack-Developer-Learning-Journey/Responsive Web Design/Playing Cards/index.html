<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing Cards</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Playing Cards</h1>
    <div class="cards-container">
        <div class="card hearts">
            <div class="corner top-left">A<br>♥</div>
            <div class="suit">♥</div>
            <div class="corner bottom-right">A<br>♥</div>
        </div>
        <div class="card spades">
            <div class="corner top-left">K<br>♠</div>
            <div class="suit">♠</div>
            <div class="corner bottom-right">K<br>♠</div>
        </div>
        <div class="card diamonds">
            <div class="corner top-left">Q<br>♦</div>
            <div class="suit">♦</div>
            <div class="corner bottom-right">Q<br>♦</div>
        </div>
        <div class="card clubs">
            <div class="corner top-left">J<br>♣</div>
            <div class="suit">♣</div>
            <div class="corner bottom-right">J<br>♣</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
