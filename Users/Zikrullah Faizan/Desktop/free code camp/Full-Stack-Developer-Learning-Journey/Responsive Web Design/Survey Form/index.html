<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 id="title">Survey Form</h1>
        <p id="description">Thank you for taking the time to help us improve our service!</p>
        <form id="survey-form">
            <div class="form-group">
                <label id="name-label" for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label id="email-label" for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label id="number-label" for="age">Age <span class="small">(optional)</span></label>
                <input type="number" id="age" name="age" min="10" max="99" placeholder="Age">
            </div>
            <div class="form-group">
                <label for="role">Which option best describes your current role?</label>
                <select id="role" name="role" required>
                    <option disabled selected value="">Select current role</option>
                    <option value="student">Student</option>
                    <option value="job">Full Time Job</option>
                    <option value="learner">Full Time Learner</option>
                    <option value="preferNo">Prefer not to say</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>Would you recommend us to a friend?</label>
                <label><input type="radio" name="recommend" value="definitely" required> Definitely</label>
                <label><input type="radio" name="recommend" value="maybe"> Maybe</label>
                <label><input type="radio" name="recommend" value="not-sure"> Not sure</label>
            </div>
            <div class="form-group">
                <label>What would you like to see improved? <span class="small">(Select all that apply)</span></label>
                <label><input type="checkbox" name="improve" value="front-end"> Front-end Projects</label>
                <label><input type="checkbox" name="improve" value="back-end"> Back-end Projects</label>
                <label><input type="checkbox" name="improve" value="data-visualization"> Data Visualization</label>
                <label><input type="checkbox" name="improve" value="challenges"> Challenges</label>
                <label><input type="checkbox" name="improve" value="open-source"> Open Source Community</label>
                <label><input type="checkbox" name="improve" value="gitter"> Gitter help rooms</label>
                <label><input type="checkbox" name="improve" value="videos"> Videos</label>
                <label><input type="checkbox" name="improve" value="meetups"> City Meetups</label>
                <label><input type="checkbox" name="improve" value="wiki"> Wiki</label>
                <label><input type="checkbox" name="improve" value="forum"> Forum</label>
                <label><input type="checkbox" name="improve" value="courses"> Additional Courses</label>
            </div>
            <div class="form-group">
                <label for="comments">Any comments or suggestions?</label>
                <textarea id="comments" name="comments" rows="4" placeholder="Enter your comment here..."></textarea>
            </div>
            <div class="form-group">
                <button type="submit" id="submit">Submit</button>
            </div>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
