name: Supabase Keep-Alive

# Supabase free-tier projects pause automatically after 7 days with no
# database activity. This workflow pings the DB twice a week so LEVELUP
# never goes to sleep during judging or the Grand Final demo.

on:
  schedule:
    - cron: '0 0 * * 0,3'   # every Sunday & Wednesday at 00:00 UTC
  workflow_dispatch:         # allows manually triggering a ping from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sS -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null -w "Ping status: %{http_code}\n"
